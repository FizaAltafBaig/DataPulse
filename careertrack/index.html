<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CareerTrack – JobReady Pulse</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.12);--tx:#f4f4f8;--mut:#a8a8bd;--in:#12121a;--acc:#8b5cf6}
html.light{--bg:#f4f4fa;--card:rgba(255,255,255,.85);--bd:rgba(20,20,40,.14);--tx:#14141f;--mut:#51516a;--in:#fff;--acc:#6d28d9}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.glass{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--bd);border-radius:16px}
.mut{color:var(--mut)}.trk{background:var(--bd)}.pf{background:linear-gradient(90deg,#8b5cf6,#ec4899)}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap}
.nav a:hover{background:var(--bd)}.nav a.on{background:#7c3aed;color:#fff}
input,select,textarea{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;color:var(--tx);font-size:14px}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:#8b5cf6}
:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
.btn{background:#7c3aed;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;white-space:nowrap}.btn:hover{background:#6d28d9}
.sec{background:var(--bd);color:var(--tx)}.chip{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bd);cursor:pointer}.chip.on{background:#7c3aed;color:#fff}
.chk{max-height:11rem;overflow-y:auto}
@media(max-width:767px){#side{position:fixed;inset:auto 0 0 0;z-index:30;padding:4px;background:var(--bg);border-top:1px solid var(--bd)}
#side .brand{display:none}#side .nav{display:flex;overflow-x:auto;gap:2px}#side .nav a span{display:none}main{padding-bottom:90px}}
</style>
</head>
<body class="min-h-screen">
<div class="md:flex">
 <div id="side" class="md:w-60 md:min-h-screen md:fixed md:p-5 md:border-r" style="border-color:var(--bd)">
  <div class="brand mb-6"><h1 class="text-xl font-extrabold">CareerTrack<span class="text-violet-400">.</span></h1><p class="text-xs mut">JobReady Pulse · Free for students</p></div>
  <nav class="nav md:space-y-1" id="nav" aria-label="Main"></nav>
 </div>
 <div class="flex-1 md:ml-60 min-w-0">
  <header class="sticky top-0 z-20 px-4 md:px-8 py-3 flex items-center gap-3 flex-wrap border-b backdrop-blur" style="background:var(--bg);border-color:var(--bd)">
   <div id="topMeter"></div>
   <div class="flex-1 min-w-[160px]"><div class="text-[11px] mut">Target role readiness</div><select id="roleSel" class="!w-auto !py-1 mt-1" aria-label="Target role"></select></div>
   <button class="btn sec" onclick="toggleTheme()" aria-label="Toggle theme"><i class="fas fa-circle-half-stroke"></i></button>
   <button class="btn" onclick="openAdd()"><i class="fas fa-plus mr-1"></i>Add Course</button>
  </header>
  <main id="main" class="p-4 md:p-8 max-w-6xl"></main>
 </div>
</div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 grid place-items-center p-4">
 <div class="glass !bg-[var(--in)] w-full max-w-md p-5 max-h-[92vh] overflow-auto" role="dialog" aria-label="Add custom course">
  <div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">Add custom course</h3><button onclick="closeAdd()" class="text-2xl leading-none mut" aria-label="Close">×</button></div>
  <div class="space-y-3">
   <div><label class="text-xs mut" for="fName">Course name</label><input id="fName" placeholder="e.g. Pandas Crash Course"></div>
   <div><label class="text-xs mut" for="fLink">YouTube playlist URL</label><input id="fLink" placeholder="https://youtube.com/playlist?list=..."></div>
   <div class="grid grid-cols-2 gap-3"><div><label class="text-xs mut" for="fTot">Videos</label><input id="fTot" type="number" min="1" max="60" value="12"></div>
   <div><label class="text-xs mut" for="fSk">Unlocks skills of</label><select id="fSk"></select></div></div>
   <button class="btn w-full" onclick="addCourse()">Generate modules</button>
  </div></div></div>
<input type="file" id="imp" accept="application/json" class="hidden">

<script>
/* ============ CONFIG: plug in your backend here ============ */
const FIREBASE_CONFIG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_APP_ID"}; // paste from Firebase console
const API_BASE=""; // e.g. "https://api.yourdomain.com" (FastAPI). Expected: GET/PUT {API_BASE}/api/progress
const LS='jobready_pulse_v1';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

/* ============ STATIC CATALOG ============ */
// id, name, icon, skills unlocked at 70%, lessons
const CAT=[
["py","Python Programming for AI/DS","fab fa-python",["Python","OOP","NumPy"],"Setup & syntax|Data types & control flow|Functions & modules|OOP & classes|NumPy arrays|File I/O & errors"],
["sql","Data Analysis & SQL Mastery","fas fa-database",["SQL Joins","Pandas","Data Visualization"],"SELECT, WHERE, GROUP BY|JOINs & subqueries|Window functions|Pandas DataFrames|Cleaning messy data|Charts with Matplotlib"],
["ml","Machine Learning & Scikit-Learn","fas fa-robot",["Scikit-Learn","Random Forest","Model Evaluation"],"Regression basics|Train/test split|Decision trees & Random Forest|Metrics: precision, recall, AUC|Cross-validation|Build a full pipeline"],
["dl","Deep Learning & Neural Networks","fas fa-brain",["Neural Networks","PyTorch","CNN"],"Perceptron & backprop|Activation & loss|PyTorch tensors|Training loops|CNNs for images|Regularisation & tuning"],
["api","API Development with FastAPI & Pydantic","fas fa-plug",["FastAPI","Pydantic","REST APIs"],"REST principles|First FastAPI app|Pydantic models|Auth & JWT|Serving an ML model|Testing with pytest"],
["git","Git, Docker & Deployment Workflows","fab fa-docker",["Git","Docker","CI/CD"],"Git branching|Pull requests|Dockerfile basics|docker-compose|GitHub Actions CI|Deploy to cloud"],
["fe","Frontend Basics (HTML/CSS/JS)","fab fa-js",["HTML/CSS","JavaScript"],"Semantic HTML|CSS layout (flex/grid)|JS fundamentals|DOM & events|Fetch API|Mini app"],
["dsa","Advanced Data Structures & Algorithms","fas fa-sitemap",["Data Structures","Algorithms"],"Big-O|Arrays, stacks, queues|Hash maps|Trees & graphs|Sorting & searching|Dynamic programming"]];
// id, name, icon, {skill:weight}, course ids, project ids
const ROLES=[
["da","Data Analyst","fa-chart-pie",{Python:2,"SQL Joins":3,Pandas:3,"Data Visualization":2},["py","sql"],["p2"]],
["be","Python Backend Developer","fa-server",{Python:2,FastAPI:3,Pydantic:2,"REST APIs":2,Git:1,Docker:2},["py","api","git"],["p3"]],
["ml","Machine Learning Engineer","fa-microchip",{Python:2,"Scikit-Learn":3,"Random Forest":2,"Model Evaluation":2,"Neural Networks":2,Docker:1},["py","ml","dl"],["p1"]],
["auto","Data Entry / Admin Automation Specialist","fa-gears",{Python:2,Pandas:3,"REST APIs":1,Git:1},["py","sql"],["p4"]],
["fs","Full-Stack AI Application Developer","fa-layer-group",{FastAPI:3,JavaScript:2,"HTML/CSS":1,"Scikit-Learn":2,Docker:2,"REST APIs":2},["api","fe","ml"],["p1","p5"]]];
const PROJ=[
["p1","Customer Churn Classifier with FastAPI & Streamlit","Advanced",["Clean the telco churn CSV with Pandas","Train a Random Forest and report AUC","Wrap the model in a FastAPI /predict endpoint with Pydantic","Build a Streamlit form that calls the API","Dockerise and deploy; write the README"]],
["p2","Sales Analytics Dashboard (SQL + Pandas)","Intermediate",["Load a sales dataset into SQLite","Write JOIN and window-function queries","Clean and aggregate with Pandas","Plot monthly trends","Publish findings as a short case study"]],
["p3","Task Manager REST API with Auth & Docker","Intermediate",["Design endpoints and Pydantic schemas","Implement CRUD with FastAPI","Add JWT login","Write pytest tests","Containerise and push to GitHub"]],
["p4","CSV/Excel Automation Bot","Beginner",["Pick a repetitive office task","Read and validate files with Pandas","Generate a cleaned report automatically","Schedule it and log errors","Record a 2-minute demo"]],
["p5","AI Chat Frontend + Model API","Advanced",["Build a chat UI in HTML/CSS/JS","Create a FastAPI model endpoint","Connect with fetch() and handle errors","Add history in localStorage","Deploy frontend on GitHub Pages"]]];
const QB=[
["Python","Beginner","What is the difference between a list and a tuple?","Lists are mutable, tuples immutable and hashable (usable as dict keys). Tuples are slightly faster and signal fixed data."],
["Python","Intermediate","How do generators work and why use them?","They yield values lazily using yield, so large data streams use little memory. State is kept between calls."],
["Python","Scenario-based","A script slows down on a 5 GB CSV. What do you do?","Profile first; read in chunks or use dtypes/usecols; vectorise instead of loops; consider Parquet or Polars/Dask."],
["SQL","Beginner","WHERE vs HAVING?","WHERE filters rows before grouping; HAVING filters groups after aggregation."],
["SQL","Intermediate","INNER vs LEFT JOIN, and when do rows go missing?","INNER keeps matches only; LEFT keeps all left rows with NULLs. Filtering right-table columns in WHERE turns a LEFT into an INNER."],
["SQL","Scenario-based","Find the top 3 customers by revenue per month.","Aggregate by month and customer, then RANK()/ROW_NUMBER() OVER (PARTITION BY month ORDER BY revenue DESC) and keep rank <= 3."],
["ML","Beginner","Overfitting vs underfitting?","Overfit: great on train, poor on test (high variance). Underfit: poor on both (high bias). Fix with regularisation, more data, simpler or richer models."],
["ML","Intermediate","Why can accuracy be misleading?","With imbalanced classes a model predicting the majority class looks accurate. Use precision, recall, F1, PR-AUC."],
["ML","Scenario-based","Your model performs well offline but badly in production. Why?","Data drift, train/serve skew, leakage, different preprocessing. Monitor inputs, version pipelines, validate with a holdout from recent data."],
["APIs","Beginner","What makes an API RESTful?","Resource URLs, HTTP verbs, stateless requests, proper status codes, JSON representations."],
["APIs","Intermediate","What does Pydantic do in FastAPI?","Validates and parses request/response data using type hints and generates the OpenAPI schema automatically."],
["APIs","Scenario-based","Your /predict endpoint times out under load. Next steps?","Load model once at startup, use async/workers, batch requests, cache results, add a queue for slow jobs, scale horizontally."],
["System Design","Beginner","What is a database index?","A data structure (often a B-tree) that speeds up reads at the cost of slower writes and extra storage."],
["System Design","Intermediate","Design a URL shortener.","Key-value store of code to URL, base62 IDs, cache hot links, rate-limit, analytics via async queue."],
["System Design","Scenario-based","Design an ML-powered recommendation service.","Offline training pipeline, feature store, model registry, low-latency serving API with cache, A/B tests and monitoring."]];
const CATS=["Python","SQL","ML","APIs","System Design"],LVLS=["Beginner","Intermediate","Scenario-based"];
const NAV=[["dash","Dashboard","fa-gauge-high"],["courses","My Courses","fa-book-open"],["matrix","Skill Matrix","fa-table-cells"],["careers","Career Paths & Jobs","fa-briefcase"],["prep","Interview Prep","fa-comments"],["projects","Guided Projects","fa-diagram-project"],["port","Portfolio Generator","fa-id-card"]];

/* ============ STATE ============ */
const mkCourse=(a,done=0)=>({id:a[0],name:a[1],icon:a[2],skills:a[3],custom:false,link:'',items:a[4].split('|').map((t,i)=>({t,d:i<done}))});
const state={user:{name:'Your Name',role:'da',theme:'dark'},courses:[],skills:{},projects:{},readiness:{}};
function defaults(){state.courses=CAT.map(c=>mkCourse(c,{py:5,sql:3,git:1}[c[0]]||0));state.projects={}}
const pct=c=>c.items.length?Math.round(c.items.filter(i=>i.d).length/c.items.length*100):0;
function recompute(){
 const sk={};state.courses.forEach(c=>{const p=pct(c);c.skills.forEach(s=>{if(!sk[s]||p>sk[s].p)sk[s]={p,from:c.name}})});state.skills=sk;
 const cp=id=>{const c=state.courses.find(x=>x.id===id);return c?pct(c):0};
 ROLES.forEach(([id,,,w,co,pj])=>{
  const ws=Object.values(w).reduce((a,b)=>a+b,0);
  const s=Object.entries(w).reduce((a,[k,x])=>a+x*Math.min((sk[k]?sk[k].p:0)/70,1)*100,0)/ws; // 70% = fully verified
  const c=avg(co.map(cp)),p=avg(pj.map(i=>({done:100,prog:40}[state.projects[i]]||0)));
  state.readiness[id]={skills:Math.round(s),courses:Math.round(c),projects:Math.round(p),total:Math.round(.6*s+.2*c+.2*p)}})}
const unlocked=()=>Object.keys(state.skills).filter(s=>state.skills[s].p>=70);

/* ============ PERSISTENCE: local -> Firebase -> REST ============ */
let fb=null,pt;
function apply(d){if(!d||!Array.isArray(d.courses)||typeof d.user!=='object')return false;
 state.user={...state.user,...d.user};state.courses=d.courses.filter(c=>c&&c.id&&Array.isArray(c.items)&&Array.isArray(c.skills));state.projects=d.projects||{};return true}
function persist(){const d={user:state.user,courses:state.courses,projects:state.projects};
 try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}
 clearTimeout(pt);pt=setTimeout(async()=>{
  if(fb)try{await fb.db.doc('users/'+fb.uid).set({state:d,updated:Date.now()})}catch(e){console.warn('Firestore save failed',e)}
  if(API_BASE)try{await fetch(API_BASE+'/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'/* ,Authorization:'Bearer '+token */},body:JSON.stringify(d)})}catch(e){console.warn('API save failed',e)}
 },600)}
async function initBackends(){
 if(!FIREBASE_CONFIG.apiKey.startsWith('YOUR_'))try{
  for(const f of['app','auth','firestore'])await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-'+f+'-compat.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  firebase.initializeApp(FIREBASE_CONFIG);
  const u=(await firebase.auth().signInAnonymously()).user; // swap for Google/email sign-in in production
  fb={db:firebase.firestore(),uid:u.uid};const snap=await fb.db.doc('users/'+u.uid).get();if(snap.exists&&apply(snap.data().state)){recompute();render()}
 }catch(e){console.warn('Firebase unavailable; using local storage',e)}
 if(API_BASE)try{const r=await fetch(API_BASE+'/api/progress');if(r.ok&&apply(await r.json())){recompute();render()}}catch(e){console.warn('API unavailable',e)}}
function exportData(){const b=new Blob([JSON.stringify({app:'jobready-pulse',v:1,data:{user:state.user,courses:state.courses,projects:state.projects}},null,2)],{type:'application/json'});dl(b,'jobready-backup.json')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app==='jobready-pulse'&&apply(j.data)){recompute();persist();render();alert('Backup restored.')}else alert('This is not a valid JobReady backup file.')}catch(x){alert('Could not read file: invalid JSON.')}};r.readAsText(f);e.target.value=''};

/* ============ UI HELPERS ============ */
const col=p=>p<40?'#ef4444':p<70?'#eab308':'#22c55e';
const msg=p=>p<40?'Abhi time hai, courses complete karo':p<=70?'Junior roles ke liye ready!':'Apply karo! Interview ready!';
const bar=(p,c)=>`<div class="w-full h-2 trk rounded-full" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div class="h-2 rounded-full ${c?'':'pf'}" style="width:${p}%;${c?'background:'+c:''};transition:width .4s"></div></div>`;
function meter(p,size=56,sw=6){const r=(size-sw)/2,L=2*Math.PI*r;return`<div class="relative shrink-0" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" class="trk" stroke="currentColor" style="color:var(--bd)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col(p)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p/100)}" style="transition:stroke-dashoffset .6s"/></svg><div class="absolute inset-0 grid place-items-center font-bold" style="font-size:${size/4.2}px">${p}%</div></div>`}
const role=id=>ROLES.find(r=>r[0]===id)||ROLES[0];
const head=(t,s)=>`<h2 class="text-2xl md:text-3xl font-extrabold">${t}</h2><p class="mut text-sm mb-6">${s}</p>`;

function courseCard(c){const p=pct(c);let rows='';
 c.items.forEach((v,i)=>{if(i%4===0)rows+=`<div class="text-[11px] mut pt-1">Module ${i/4+1}</div>`;
  rows+=`<label class="flex items-center gap-2 text-[13px] p-1.5 rounded-lg cursor-pointer"><input type="checkbox" ${v.d?'checked':''} onchange="tick('${c.id}',${i},this.checked)"><span class="${v.d?'line-through mut':''}">${esc(v.t)}</span></label>`});
 return`<div class="glass overflow-hidden"><div class="h-1.5 pf"></div><div class="p-5"><div class="flex justify-between items-start mb-3"><div><h3 class="font-bold flex items-center gap-2"><i class="${esc(c.icon)}"></i>${esc(c.name)}</h3><div class="text-[11px] mut mt-1">${c.skills.map(s=>`<span class="${state.skills[s]&&state.skills[s].p>=70?'text-green-500 font-bold':''}">${esc(s)}</span>`).join(' · ')}</div></div><span class="text-sm font-bold ${p>=70?'text-green-500':'text-violet-400'}">${p}%</span></div>
 ${bar(p)}<div class="chk mt-3 space-y-0.5" data-id="${esc(c.id)}">${rows}</div>${c.custom?`<button class="text-[11px] text-red-400 mt-3" onclick="delCourse('${esc(c.id)}')"><i class="fas fa-trash mr-1"></i>Delete</button>`:''}</div></div>`}

/* ============ VIEWS ============ */
const ui={cat:'All',lvl:'All',show:new Set()};
const V={
dash(){const r=state.readiness[state.user.role],R=role(state.user.role),sk=unlocked().length,pd=Object.values(state.projects).filter(x=>x==='done').length;
 let best=null;Object.entries(R[3]).forEach(([s,w])=>{const g=w*(1-Math.min((state.skills[s]?state.skills[s].p:0)/70,1));if(g>0&&(!best||g>best.g))best={s,g}});
 const nc=best&&state.courses.find(c=>c.skills.includes(best.s));
 return head('Dashboard','Tumhara career progress ek nazar mein.')+`<div class="glass p-5 flex items-center gap-5 mb-5">${meter(r.total,104,10)}<div><div class="text-xs mut">${esc(R[1])}</div><div class="text-lg font-bold" style="color:${col(r.total)}">${msg(r.total)}</div>${nc?`<div class="text-sm mut mt-1">Next best step: learn <b>${esc(best.s)}</b> in “${esc(nc.name)}”.</div>`:'<div class="text-sm mut mt-1">All required skills verified. Time to apply!</div>'}</div></div>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-5">${[['Avg course progress',Math.round(avg(state.courses.map(pct)))+'%'],['Skills verified',sk+'/'+Object.keys(state.skills).length],['Projects done',pd+'/'+PROJ.length],['Best role match',Math.max(...Object.values(state.readiness).map(x=>x.total))+'%']].map(([a,b])=>`<div class="glass p-4"><div class="text-xs mut">${a}</div><div class="text-2xl font-extrabold mt-1">${b}</div></div>`).join('')}</div>
 <div class="glass p-5"><div class="font-bold mb-3">All roles</div><div class="space-y-3">${ROLES.map(x=>`<div><div class="flex justify-between text-sm mb-1"><span>${esc(x[1])}</span><span class="mut">${state.readiness[x[0]].total}%</span></div>${bar(state.readiness[x[0]].total,col(state.readiness[x[0]].total))}</div>`).join('')}</div></div>
 <div class="glass p-5 mt-5 flex flex-wrap gap-2 items-center"><span class="font-bold mr-2">Backup</span><button class="btn sec" onclick="exportData()"><i class="fas fa-download mr-1"></i>Export JSON</button><button class="btn sec" onclick="$('imp').click()"><i class="fas fa-upload mr-1"></i>Import JSON</button><span class="text-xs mut">${fb?'Synced with Firebase.':'Saved in this browser. Export regularly.'}</span></div>`},
courses(){return head('My Courses 🚀','YouTube, Udemy, Coursera — sab ek jagah. 70% par skills unlock hoti hain.')+`<div class="grid md:grid-cols-2 gap-5">${state.courses.map(courseCard).join('')}</div>`},
matrix(){const all=Object.keys(state.skills).sort();return head('Skill Matrix 💎','Verified badge = 70%+ in the course that teaches it.')+`<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">${all.map(s=>{const d=state.skills[s],ok=d.p>=70;return`<div class="glass p-4"><div class="flex justify-between text-sm font-bold mb-2"><span>${esc(s)}</span><span class="mut">${d.p}%</span></div>${bar(d.p,ok?'#22c55e':'')}<p class="text-[11px] mt-2 ${ok?'text-green-500 font-bold':'mut'}"><i class="fas ${ok?'fa-circle-check':'fa-lock'} mr-1"></i>${ok?'Verified':'Locked'} · ${esc(d.from)}</p></div>`}).join('')}</div>`},
careers(){return head('Career Paths & Jobs 🎯','Readiness = 60% skills + 20% courses + 20% projects.')+`<div class="grid md:grid-cols-2 gap-5">${ROLES.map(R=>{const r=state.readiness[R[0]],miss=Object.keys(R[3]).filter(s=>!state.skills[s]||state.skills[s].p<70);return`<div class="glass p-5 ${R[0]===state.user.role?'ring-2 ring-violet-500':''}"><div class="flex items-center gap-4 mb-4">${meter(r.total,70,8)}<div><div class="font-bold"><i class="fas ${R[2]} mr-2 text-violet-400"></i>${esc(R[1])}</div><div class="text-xs" style="color:${col(r.total)}">${msg(r.total)}</div></div></div>
 ${[['Skills',r.skills],['Courses',r.courses],['Projects',r.projects]].map(([a,b])=>`<div class="mb-2"><div class="flex justify-between text-xs mb-1"><span>${a}</span><span class="mut">${b}%</span></div>${bar(b,col(b))}</div>`).join('')}
 <p class="text-xs mut mt-3">${miss.length?'Still needed: '+miss.map(esc).join(', '):'All required skills verified.'}</p><button class="btn sec w-full mt-3" onclick="setRole('${R[0]}')">${R[0]===state.user.role?'Current target':'Set as target'}</button></div>`}).join('')}</div>`},
prep(){const list=QB.map((q,i)=>[q,i]).filter(([q])=>(ui.cat==='All'||q[0]===ui.cat)&&(ui.lvl==='All'||q[1]===ui.lvl));
 const chips=(a,k)=>['All',...a].map(x=>`<button class="chip ${ui[k]===x?'on':''}" onclick="ui.${k}='${x}';render()">${x}</button>`).join('');
 return head('Interview Prep 🎤','Topic aur difficulty se filter karo. Pehle khud jawab do, phir answer reveal karo.')+`<div class="flex flex-wrap gap-2 mb-2">${chips(CATS,'cat')}</div><div class="flex flex-wrap gap-2 mb-5">${chips(LVLS,'lvl')}</div><div class="space-y-3">${list.map(([q,i])=>`<div class="glass p-4"><div class="text-[11px] mut mb-1">${q[0]} · ${q[1]}</div><div class="font-semibold">${esc(q[2])}</div><button class="text-sm text-violet-400 mt-2" onclick="ui.show.has(${i})?ui.show.delete(${i}):ui.show.add(${i});render()" aria-expanded="${ui.show.has(i)}">${ui.show.has(i)?'Hide':'Reveal'} sample answer</button>${ui.show.has(i)?`<p class="text-sm mt-2 p-3 rounded-lg trk">${esc(q[3])}</p>`:''}</div>`).join('')||'<p class="mut">No questions match these filters.</p>'}</div>`},
projects(){const L={none:'Not started',prog:'In progress',done:'Completed'};return head('Guided Projects 🛠️','Projects complete karo — readiness score barhta hai aur portfolio banta hai.')+`<div class="grid md:grid-cols-2 gap-5">${PROJ.map(p=>{const st=state.projects[p[0]]||'none';return`<div class="glass p-5"><div class="text-[11px] mut mb-1">${p[2]} · ${st==='done'?'<span class="text-green-500 font-bold">Completed</span>':L[st]}</div><h3 class="font-bold mb-3">${esc(p[1])}</h3><ol class="list-decimal pl-5 text-sm space-y-1 mb-4">${p[3].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="flex gap-2">${['none','prog','done'].map(k=>`<button class="chip ${st===k?'on':''}" onclick="setProj('${p[0]}','${k}')">${L[k]}</button>`).join('')}</div></div>`}).join('')}</div>`},
port(){const u=state.user,sk=unlocked(),dn=state.courses.filter(c=>pct(c)===100),pj=PROJ.filter(p=>state.projects[p[0]]==='done');
 return head('Portfolio Generator 🪪','Verified skills, projects aur certificates — download karo ya LinkedIn par paste karo.')+`<div class="glass p-5 mb-4 flex items-center gap-4"><div class="w-14 h-14 shrink-0 rounded-full pf grid place-items-center text-xl font-bold text-white">${esc((u.name[0]||'?').toUpperCase())}</div><div class="flex-1"><input value="${esc(u.name)}" onchange="state.user.name=this.value.trim()||'Your Name';persist();render()" class="!text-lg !font-bold" aria-label="Your name"><div class="text-sm mut mt-1">${esc(role(u.role)[1])} · ${state.readiness[u.role].total}% job ready</div></div></div>
 <div class="grid md:grid-cols-3 gap-4"><div class="glass p-5"><div class="font-bold mb-3">Verified skills</div>${sk.length?sk.map(s=>`<span class="inline-block m-1 px-3 py-1 rounded-full text-sm bg-green-500/15 text-green-500 font-semibold">${esc(s)}</span>`).join(''):'<p class="text-sm mut">Koi skill abhi verified nahi.</p>'}</div>
 <div class="glass p-5"><div class="font-bold mb-3">Projects</div>${pj.length?pj.map(p=>`<div class="text-sm py-1"><i class="fas fa-circle-check text-green-500 mr-2"></i>${esc(p[1])}</div>`).join(''):'<p class="text-sm mut">Koi project complete nahi.</p>'}</div>
 <div class="glass p-5"><div class="font-bold mb-3">Certificates</div>${dn.length?dn.map(c=>`<div class="text-sm py-1"><i class="fas fa-certificate text-yellow-500 mr-2"></i>${esc(c.name)}</div>`).join(''):'<p class="text-sm mut">100% course par certificate milega.</p>'}</div></div>
 <div class="flex flex-wrap gap-2 mt-5"><button class="btn" onclick="dlPortfolio()"><i class="fas fa-download mr-1"></i>Download portfolio page</button><button class="btn sec" onclick="copyLI()"><i class="fab fa-linkedin mr-1"></i>Copy LinkedIn About</button></div>`}
};

/* ============ ACTIONS ============ */
function render(){
 document.documentElement.classList.toggle('light',state.user.theme==='light');
 const sc={};document.querySelectorAll('.chk').forEach(e=>sc[e.dataset.id]=e.scrollTop);
 $('nav').innerHTML=NAV.map(([k,l,i])=>`<a class="${page===k?'on':''}" tabindex="0" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')" ${page===k?'aria-current="page"':''}><i class="fas ${i} w-5 text-center"></i><span>${l}</span></a>`).join('');
 $('roleSel').innerHTML=ROLES.map(r=>`<option value="${r[0]}" ${r[0]===state.user.role?'selected':''}>${esc(r[1])}</option>`).join('');
 $('topMeter').innerHTML=meter(state.readiness[state.user.role].total,52,6);
 $('main').innerHTML=(V[page]||V.dash)();
 document.querySelectorAll('.chk').forEach(e=>e.scrollTop=sc[e.dataset.id]||0)}
let page=(location.hash||'#dash').slice(1);
const go=p=>{page=p;location.hash=p;render();scrollTo(0,0)};
const upd=()=>{recompute();persist();render()};
function tick(id,i,v){const c=state.courses.find(x=>x.id===id);if(c){c.items[i].d=v;upd()}}
function delCourse(id){if(confirm('Delete this course?')){state.courses=state.courses.filter(c=>c.id!==id);upd()}}
function setRole(r){state.user.role=r;upd()}
function setProj(id,s){state.projects[id]=s;upd()}
function toggleTheme(){state.user.theme=state.user.theme==='light'?'dark':'light';persist();render()}
$('roleSel').onchange=e=>setRole(e.target.value);
$('fSk').innerHTML='<option value="">No skills</option>'+CAT.map(c=>`<option value="${c[0]}">${esc(c[1])}</option>`).join('');
const openAdd=()=>{$('modal').classList.remove('hidden');$('fName').focus()},closeAdd=()=>$('modal').classList.add('hidden');
// PRODUCTION HOOK: replace with a call to your FastAPI route (YouTube Data API key must stay server-side),
// e.g. const r=await fetch(API_BASE+'/api/playlist?url='+encodeURIComponent(link)); return (await r.json()).titles;
function fetchPlaylistTitles(link,n){const T=["Introduction & setup","Core concepts","Hands-on practice","Common mistakes","Working with real data","Deep dive","Mini project","Best practices","Debugging tips","Project walkthrough","Interview questions","Wrap-up & next steps"];return Array.from({length:n},(_,i)=>T[i%T.length]+(i>=T.length?' II':''))}
function addCourse(){const name=$('fName').value.trim();if(!name){$('fName').focus();return}
 const link=$('fLink').value.trim();let n=Math.min(Math.max(parseInt($('fTot').value)||12,1),60);if(/youtube\.com|youtu\.be/.test(link))n=Math.min(Math.max(n,10),15);
 const src=CAT.find(c=>c[0]===$('fSk').value);
 state.courses.push({id:'c'+Date.now(),name,icon:'fas fa-book',skills:src?[...src[3]]:[],custom:true,link,items:fetchPlaylistTitles(link,n).map(t=>({t,d:false}))});
 closeAdd();$('fName').value='';$('fLink').value='';go('courses');upd()}
function liText(){const R=role(state.user.role),sk=unlocked();return`Aspiring ${R[1]} | ${sk.slice(0,8).join(', ')||'Learning Python, SQL & ML'}\nI'm building job-ready skills through structured learning and hands-on projects, currently ${state.readiness[R[0]].total}% ready for ${R[1]} roles.\nCompleted projects: ${PROJ.filter(p=>state.projects[p[0]]==='done').map(p=>p[1]).join('; ')||'in progress'}.\nOpen to internships and junior roles.`}
function copyLI(){const t=liText();navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('Copied!')):prompt('Copy:',t)}
function dlPortfolio(){const u=state.user,R=role(u.role),sk=unlocked(),pj=PROJ.filter(p=>state.projects[p[0]]==='done');
 const h=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(u.name)} – Portfolio</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;color:#14141f;line-height:1.6}h1{margin:0}span{display:inline-block;background:#ede9fe;color:#5b21b6;padding:4px 12px;border-radius:99px;margin:3px;font-size:14px}</style></head><body><h1>${esc(u.name)}</h1><p>${esc(R[1])} · ${state.readiness[R[0]].total}% job ready</p><h2>Verified skills</h2>${sk.map(s=>`<span>${esc(s)}</span>`).join('')||'<p>In progress</p>'}<h2>Projects</h2><ul>${pj.map(p=>`<li>${esc(p[1])}</li>`).join('')||'<li>In progress</li>'}</ul><h2>Certificates</h2><ul>${state.courses.filter(c=>pct(c)===100).map(c=>`<li>${esc(c.name)}</li>`).join('')||'<li>In progress</li>'}</ul></body></html>`;
 dl(new Blob([h],{type:'text/html'}),'portfolio.html')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeAdd()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeAdd()});
addEventListener('hashchange',()=>{page=(location.hash||'#dash').slice(1);render()});

/* ============ BOOT ============ */
(function(){let d=null;try{d=JSON.parse(localStorage.getItem(LS))}catch(e){}
 if(!apply(d))defaults();recompute();render();initBackends()})();
</script>
</body>
</html>
