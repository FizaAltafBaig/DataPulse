 <div class="glass p-5"><div class="font-bold mb-3">All roles</div><div class="space-y-3">${R.map(x=>{const v=ready(x);return`<div><div class="flex justify-between text-sm mb-1"><span>${esc(x[1])}</span><span class="mut">${v}%</span></div>${bar(v,col(v))}</div>`}).join('')}</div></div>
 <button class="text-xs text-red-400 mt-5" onclick="if(confirm('Reset all progress?')){S={name:S.name,role:S.role,done:{},qa:{},vid:{},proj:{}};save();render()}">Reset all progress</button>`},
courses(){const sk=skills();return head('My Courses','Every module has 6 tabs: video, books, notes, quiz, dataset and deploy.')+`<div class="grid md:grid-cols-2 gap-5">${C.map(c=>{const p=pct(c);return`<div class="glass overflow-hidden"><div class="h-1.5 pf"></div><div class="p-5"><div class="flex justify-between items-start mb-3"><div><h3 class="font-bold"><i class="${c.ic} mr-2"></i>${esc(c.n)}</h3><div class="text-[11px] mut mt-1">${c.sk.map(s=>`<span class="${sk[s].p>=70?'text-green-400 font-bold':''}">${s}</span>`).join(', ')}</div></div><span class="text-sm font-bold ${p>=70?'text-green-400':'text-violet-400'}">${p}%</span></div>${bar(p)}<div class="mt-3 space-y-2">${c.m.map((m,i)=>`<button class="opt flex justify-between items-center gap-3" onclick="openDr('${c.id}',${i})"><span>Module ${i+1}: ${esc(m[0])}</span>${stIcon(c,i)}</button>`).join('')}</div></div></div>`}).join('')}</div>`},
matrix(){return head('Skill Matrix','Verified badge = 70%+ in the course that teaches it.')+C.map(c=>`<div class="glass p-5 mb-4"><div class="font-bold mb-3"><i class="${c.ic} mr-2"></i>${esc(c.n)}</div><div class="grid sm:grid-cols-3 gap-4">${c.sk.map(s=>{const p=pct(c),ok=p>=70;return`<div><div class="flex justify-between text-sm mb-1"><span>${s}</span><span class="mut">${p}%</span></div>${bar(p,ok?'#22c55e':'')}<p class="text-[11px] mt-1 ${ok?'text-green-400 font-bold':'mut'}"><i class="fas ${ok?'fa-circle-check':'fa-lock'} mr-1"></i>${ok?'Verified':'Locked'}</p></div>`}).join('')}</div></div>`).join('')},
careers(){const sk=skills();return head('Career Paths & Jobs','Readiness = 80% skills + 20% projects.')+`<div class="grid md:grid-cols-2 gap-5">${R.map(r=>{const v=ready(r),miss=Object.keys(r[3]).filter(s=>!sk[s]||sk[s].p<70);return`<div class="glass p-5 ${r[0]===S.role?'ring-2 ring-violet-500':''}"><div class="flex items-center gap-4 mb-4">${meter(v,70,8)}<div><div class="font-bold"><i class="fas ${r[2]} mr-2 text-violet-400"></i>${esc(r[1])}</div><div class="text-xs" style="color:${col(v)}">${msg(v)}</div></div></div><div class="space-y-2">${Object.keys(r[3]).map(s=>{const x=Math.min((sk[s]?sk[s].p:0)/70*100,100);return`<div><div class="flex justify-between text-xs mb-1"><span>${s}</span><span class="mut">${Math.round(x)}%</span></div>${bar(Math.round(x),col(x))}</div>`}).join('')}</div><p class="text-xs mut mt-3">${miss.length?'Still needed: '+miss.join(', '):'All required skills verified.'}</p><button class="btn sec w-full mt-3" onclick="setRole('${r[0]}')">${r[0]===S.role?'Current target':'Set as target'}</button></div>`}).join('')}</div>`},
prep(){const L=IQ.map((q,i)=>[q,i]).filter(([q])=>(ui.rf==='all'||q[1].split(',').includes(ui.rf))&&(ui.tf==='All'||q[0]===ui.tf));
 const card=([q,i],big)=>`<div class="glass p-4 ${big?'ring-2 ring-violet-500':''}"><div class="text-[11px] mut mb-1">${q[0]}</div><div class="font-semibold">${esc(q[2])}</div><button class="text-sm text-violet-400 mt-2" onclick="ui.show.has(${i})?ui.show.delete(${i}):ui.show.add(${i});render()">${ui.show.has(i)?'Hide':'Reveal'} model answer</button>${ui.show.has(i)?`<p class="text-sm mt-2 p-3 rounded-lg trk">${esc(q[3])}</p>`:''}</div>`;
 const rc=[['all','All roles'],...R.map(r=>[r[0],r[1]])];
 return head('Interview & Trend Prep','Pick a role, check the trends, then practice mock interviews.')+`<div class="glass p-5 mb-5"><div class="font-bold mb-1">Trending hiring skills</div><p class="text-[11px] mut mb-3">Directional themes from AI job posts. Check current listings in your target market.</p><div class="grid sm:grid-cols-2 gap-3">${TR.map(t=>`<div class="p-3 rounded-xl trk"><div class="font-bold text-sm text-violet-300">${t[0]}</div><div class="text-xs mut mt-1">${t[1]}</div></div>`).join('')}</div></div>
 <div class="flex flex-wrap gap-2 mb-2">${rc.map(x=>`<button class="chip ${ui.rf===x[0]?'on':''}" onclick="ui.rf='${x[0]}';ui.sim=null;render()">${x[1]}</button>`).join('')}</div>
 <div class="flex flex-wrap gap-2 mb-4">${['All','Coding','LLM / System Design','Behavioral (STAR)'].map(x=>`<button class="chip ${ui.tf===x?'on':''}" onclick="ui.tf='${x}';ui.sim=null;render()">${x}</button>`).join('')}<button class="btn !py-1 ml-auto" onclick="sim()"><i class="fas fa-dice mr-1"></i>Mock interview: random question</button></div>
 ${ui.sim!=null&&IQ[ui.sim]?`<div class="mb-4">${card([IQ[ui.sim],ui.sim],1)}</div>`:''}<div class="space-y-3">${L.map(x=>card(x)).join('')||'<p class="mut">No questions match these filters.</p>'}</div>`},
projects(){const Lb={none:'Not started',prog:'In progress',done:'Completed'};return head('Guided Projects','Complete projects to raise your readiness score and build your portfolio.')+`<div class="grid md:grid-cols-2 gap-5">${P.map(p=>{const st=S.proj[p[0]]||'none';return`<div class="glass p-5"><h3 class="font-bold mb-3">${esc(p[1])}</h3><ol class="list-decimal pl-5 text-sm space-y-1 mb-4">${p[2].map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="flex gap-2 flex-wrap">${['none','prog','done'].map(k=>`<button class="chip ${st===k?'on':''}" onclick="S.proj['${p[0]}']='${k}';save();render()">${Lb[k]}</button>`).join('')}</div></div>`}).join('')}</div>`},
port(){const sk=unlocked(),dn=C.filter(c=>pct(c)===100),pj=P.filter(p=>S.proj[p[0]]==='done');
 return head('Portfolio Generator','Verified skills, projects and certificates, ready for LinkedIn.')+`<div class="glass p-5 mb-4 flex items-center gap-4"><div class="w-14 h-14 shrink-0 rounded-full pf grid place-items-center text-xl font-bold">${esc((S.name[0]||'?').toUpperCase())}</div><div class="flex-1"><input value="${esc(S.name)}" onchange="S.name=this.value.trim()||'Your Name';save();render()" aria-label="Your name"><div class="text-sm mut mt-1">${esc(role(S.role)[1])} | ${ready(role(S.role))}% job ready</div></div></div>
 <div class="grid md:grid-cols-3 gap-4"><div class="glass p-5"><div class="font-bold mb-3">Verified skills</div>${sk.length?sk.map(s=>`<span class="inline-block m-1 px-3 py-1 rounded-full text-sm bg-green-500/15 text-green-400">${s}</span>`).join(''):'<p class="text-sm mut">No verified skills yet.</p>'}</div>
 <div class="glass p-5"><div class="font-bold mb-3">Projects</div>${pj.length?pj.map(p=>`<div class="text-sm py-1"><i class="fas fa-circle-check text-green-400 mr-2"></i>${esc(p[1])}</div>`).join(''):'<p class="text-sm mut">No completed projects yet.</p>'}</div>
 <div class="glass p-5"><div class="font-bold mb-3">Certificates</div>${dn.length?dn.map(c=>`<div class="text-sm py-1"><i class="fas fa-award text-yellow-400 mr-2"></i>${esc(c.n)}</div>`).join(''):'<p class="text-sm mut">Finish a course at 100% to earn a certificate.</p>'}</div></div>
 <button class="btn mt-5" onclick="copyLI()"><i class="fab fa-linkedin mr-1"></i>Copy LinkedIn About</button>`}
};

/* ---------- actions ---------- */
function render(){const ds=$('dbody')?$('dbody').scrollTop:0;
 $('nav').innerHTML=NAV.map(([k,l,i])=>`<a class="${page===k?'on':''}" tabindex="0" onclick="go('${k}')" onkeydown="if(event.key==='Enter')go('${k}')"><i class="fas ${i} w-5 text-center"></i><span>${l}</span></a>`).join('');
 $('roleSel').innerHTML=R.map(r=>`<option value="${r[0]}" ${r[0]===S.role?'selected':''}>${esc(r[1])}</option>`).join('');
 $('topMeter').innerHTML=meter(ready(role(S.role)),52,6);
 $('main').innerHTML=(V[page]||V.dash)();
 const d=$('drawer');d.classList.toggle('hidden',!dr);d.innerHTML=drawer();if($('dbody'))$('dbody').scrollTop=ds}
const go=p=>{page=p;location.hash=p;dr=null;render();scrollTo(0,0)};
const openDr=(c,m)=>{dr={c,m,t:'vid'};render()},closeDr=()=>{dr=null;render()};
function setRole(r){S.role=r;save();render()}
function toggleDone(k){S.done[k]=!S.done[k];save();render()}
function ans(k,j,v){if(v===''||v==null)return;S.qa[k]=S.qa[k]||[];S.qa[k][j]=v;save();render()}
function setVid(k){const v=$('vurl').value.trim();if(v&&!embed(v)){alert('Please paste a valid YouTube link.');return}S.vid[k]=v;save();render()}
function sim(){const L=IQ.map((q,i)=>i).filter(i=>(ui.rf==='all'||IQ[i][1].split(',').includes(ui.rf))&&(ui.tf==='All'||IQ[i][0]===ui.tf));if(L.length){ui.sim=L[Math.floor(Math.random()*L.length)];ui.show.delete(ui.sim);render()}}
function copyLI(){const r=role(S.role),t=`Aspiring ${r[1]} | ${unlocked().slice(0,8).join(', ')||'Python, SQL, ML, AI'}\nBuilding job-ready skills through structured courses, quizzes and projects. Currently ${ready(r)}% ready for ${r[1]} roles.\nProjects: ${P.filter(p=>S.proj[p[0]]==='done').map(p=>p[1]).join('; ')||'in progress'}.\nOpen to internships and junior roles.`;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>alert('Copied!')):prompt('Copy:',t)}
$('roleSel').onchange=e=>setRole(e.target.value);
addEventListener('keydown',e=>{if(e.key==='Escape'&&dr)closeDr()});
addEventListener('hashchange',()=>{page=(location.hash||'#dash').slice(1);render()});
render();
</script>
</body>
</html>
