:root{
  --bg:#07080c; --bg-2:#0c0e14; --surface:#10131b; --surface-2:#151925;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --text:#eef0f6; --muted:#9aa1b4; --dim:#6b7289;
  --accent:#8b7cff; --accent-2:#36d6c3; --accent-3:#ff7ab6;
  --grad:linear-gradient(120deg,#8b7cff 0%,#36d6c3 55%,#7ce0ff 100%);
  --radius:16px; --max:1180px;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:rgba(139,124,255,.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#000;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}

/* NAV */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s,backdrop-filter .3s;border-bottom:1px solid transparent}
header.scrolled{background:rgba(7,8,12,.72);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center}
.nav-links{display:flex;gap:4px;list-style:none}
.nav-links a{padding:8px 14px;border-radius:8px;color:var(--muted);font-size:14px;font-weight:500;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-cta{display:flex;gap:10px;align-items:center}
.menu-btn{display:none;background:none;border:1px solid var(--line-2);border-radius:10px;width:40px;height:40px;cursor:pointer}
.menu-btn span{display:block;width:18px;height:1.5px;background:var(--text);margin:4px auto;transition:.3s}
.menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(5.5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-5.5px) rotate(-45deg)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;white-space:nowrap}
.btn-primary{background:var(--text);color:#07080c}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 30px -10px rgba(139,124,255,.7)}
.btn-ghost{background:rgba(255,255,255,.03);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.24)}
.btn-lg{padding:14px 24px;font-size:15.5px;border-radius:12px}
.btn svg{width:16px;height:16px;transition:transform .2s}
.btn:hover svg{transform:translateX(3px)}

.glow{position:absolute;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.glow-1{width:560px;height:560px;background:#5b47ff;top:-180px;left:50%;transform:translateX(-70%)}
.glow-2{width:420px;height:420px;background:#13b5a2;top:-60px;left:55%;opacity:.32}
.hero-inner{text-align:center;max-width:900px;margin:0 auto}
